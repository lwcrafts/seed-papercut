<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纸雕光影灯分层图纸提取器 · 3D 预览</title>
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body>
    <div id="webgl-container"></div>

    

    <header class="topbar">
      <div class="brand" id="brand-dropdown-toggle" style="cursor: pointer; position: relative; pointer-events: auto;">
        <div class="brand-mark">▤</div>
        <div>
          <div class="brand-title"><span id="brand-scene-name">案例一</span> <span class="brand-tag" style="background: transparent; padding: 0; opacity: 0.7; transform: translateY(1px); display: inline-block;">▼</span></div>
        </div>
        <div id="brand-dropdown-menu" class="glass hidden" style="position: absolute; top: calc(100% + 12px); left: 0; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; min-width: 120px; z-index: 100;">
        </div>
      </div>

      <!-- 场景切换器：由 src/app/main.ts 按 SCENES 清单渲染；只有 1 个场景时保持 hidden -->
      <nav id="scene-switcher" class="scene-switcher hidden" style="display: none;" aria-label="预置场景切换"></nav>

      <div id="data-status-badge" class="status-pill">
        <span class="status-dot"></span>
        <span id="data-status-text">图层装配中…</span>
      </div>

      <div class="top-actions">
        <button id="btn-export-zip" class="btn" disabled title="等待图层数据载入…">导出切割 ZIP</button>
        <button id="btn-screenshot" class="btn">导出渲染图</button>
      </div>
    </header>
    
    
    <!-- Left Slice Strip -->
    <div id="left-nav" style="position: absolute; left: 30px; top: 340px; bottom: 80px; display: flex; flex-direction: column; gap: 8px; pointer-events: none;">
      <button id="btn-solo-all" class="slice-thumb active" style="margin-left: 20px; height: 32px; flex-shrink: 0; font-size: 12px; font-family: inherit; color: white;">复原</button>
      <div id="slice-strip" style="flex: 1; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; padding-right: 4px; scrollbar-width: none;"></div>
      <button id="btn-open-2d" class="slice-thumb" style="margin-left: 20px; height: 32px; flex-shrink: 0; font-size: 12px; background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); font-family: inherit; color: white;">2D详情</button>
    </div>

    
    <!-- Original Image Thumbnail -->
    <div id="source-image-preview" class="glass" style="position: fixed; top: 120px; left: 14px; z-index: 10; padding: 6px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; " >
      <div style="font-size: 10px; color: var(--text-faint); text-align: center; letter-spacing: 0.1em; font-family: ui-monospace, monospace; font-weight: 600;">原图对比</div>
      <img id="img-source" src="scenes/xiake.jpg" alt="原图" style="max-width: 120px; max-height: 150px; object-fit: contain; border-radius: 6px; display: block;" />
    </div>
    </div>



    

    <div class="bottom-dock">
      <div class="dock-group">
      <!-- Light system popup -->
      <div class="dock-item">
        <div id="light-menu" class="dock-menu glass hidden" style="width: 280px;">
          <div class="control">
            <div class="control-head">
              <label>LED 背光亮度</label>
              <span id="light-intensity-val" class="mono value">2.2x</span>
            </div>
            <input id="slider-intensity" type="range" min="0" max="5" step="0.1" value="2.2" />
            <div class="scale-labels"><span>0 熄灯</span><span>2.5 标准</span><span>5.0 高亮</span></div>
          </div>

          <div class="control">
            <label class="control-label">光源色温</label>
            <div class="preset-grid">
              <button class="preset active" data-color="#FFE0B2"><span class="swatch" style="background:#FFE0B2"></span>3000K</button>
              <button class="preset" data-color="#FFF4E8"><span class="swatch" style="background:#FFF4E8"></span>4500K</button>
              <button class="preset" data-color="#E8F1FF"><span class="swatch" style="background:#E8F1FF"></span>6000K</button>
              <button class="preset" data-color="#FFA450"><span class="swatch" style="background:#FFA450"></span>晚霞橙</button>
            </div>
            <div class="color-row">
              <span>自定义颜色</span>
              <span class="color-input-wrap">
                <input id="picker-light-color" type="color" value="#FFE0B2" />
                <span id="hex-color-val" class="mono value">#FFE0B2</span>
              </span>
            </div>
          </div>
          <label class="switch-row">
            <span><span class="switch-title">暗室模式</span></span>
            <input id="toggle-darkroom" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span><span class="switch-title">纸张微透光漫射</span></span>
            <input id="toggle-translucency" type="checkbox" checked />
          </label>
        </div>
        <button id="light-toggle" class="btn dock-btn glass">
          灯光
        </button>
      </div>

            <!-- Background color button -->
      <div class="dock-item">
        <div id="bg-menu" class="dock-menu glass hidden" style="width: 180px;">
          <div class="dock-menu-label">BACKGROUND</div>
          <button class="btn btn-block bg-preset" data-bg="linear-gradient(135deg, #0a1128, #05070d)"><span class="swatch" style="background: linear-gradient(135deg, #0a1128, #05070d)"></span>深夜蓝</button>
          <button class="btn btn-block bg-preset" data-bg="linear-gradient(135deg, #1e293b, #0f172a)"><span class="swatch" style="background: linear-gradient(135deg, #1e293b, #0f172a)"></span>石板灰</button>
          <button class="btn btn-block bg-preset" data-bg="linear-gradient(135deg, #3b0764, #170229)"><span class="swatch" style="background: linear-gradient(135deg, #3b0764, #170229)"></span>星云紫</button>
          <button class="btn btn-block active bg-preset" data-bg="linear-gradient(135deg, #064e3b, #022c22)"><span class="swatch" style="background: linear-gradient(135deg, #064e3b, #022c22)"></span>极光绿</button>
          <div style="margin-top: 4px; font-size: 11px; color: var(--text-faint); text-align: center;">纯色自定义</div>
          <div class="color-input-wrap" style="justify-content: center; margin-top: 4px;">
            <input id="picker-bg-color" type="color" value="#05070d" style="width: 20px; height: 20px;" />
            <span id="hex-bg-val" class="mono value">#05070D</span>
          </div>
        </div>
        <button id="bg-toggle" class="btn dock-btn glass" style="background: linear-gradient(135deg, #064e3b, #022c22); border-color: rgba(255,255,255,0.2);">
          背景
        </button>
      </div>
      </div>

      <div class="dock-group">

      <!-- Structure popup -->
      <div class="dock-item">
        <div id="struct-menu" class="dock-menu glass hidden" style="width: 180px;">

          <div class="dock-menu-label">STRUCTURE</div>
          <label class="check-row" style="padding: 6px 12px; font-size: 12px;"><span>外框面板</span><input id="check-vis-frame" type="checkbox" checked /></label>
          <label class="check-row" style="padding: 6px 12px; font-size: 12px;"><span id="struct-paper-label">纸雕卡层</span><input id="check-vis-paper" type="checkbox" checked /></label>
          <label class="check-row" style="padding: 6px 12px; font-size: 12px;"><span>EVA 垫条</span><input id="check-vis-spacers" type="checkbox" checked /></label>
          <label class="check-row" style="padding: 6px 12px; font-size: 12px;"><span>LED 后盖板</span><input id="check-vis-backplate" type="checkbox" checked /></label>

        </div>
        <button id="struct-toggle" class="btn dock-btn glass">结构显隐</button>
      </div>

      <!-- Camera switch popup -->
      <div class="dock-item">
        <div id="cam-menu" class="dock-menu glass hidden">
          <div class="dock-menu-label">VIEW</div>
          <button id="cam-front" class="btn btn-block">正视</button>
          <button id="cam-persp" class="btn btn-block active">45° 透视</button>
          <button id="cam-side" class="btn btn-block">侧视层间</button>
          <button id="cam-top" class="btn btn-block">俯视</button>
        </div>
        <button id="cam-toggle" class="btn dock-btn glass">
          <span id="cam-current-label">45° 透视</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5; margin-left:6px;"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
      </div>
      
      <!-- Explode slider popup -->
      <div class="dock-item">
        <div id="explode-menu" class="dock-menu glass hidden" style="width: 280px;">
          <div class="explode-head">
            <label for="slider-explode">3D 爆炸分解</label>
            <span id="explode-percent-pill" class="pill">0% 完全组装</span>
          </div>
          <input id="slider-explode" type="range" min="0" max="100" value="0" />
          <div class="explode-actions">
            <span class="jump-group">
              <button class="btn btn-jump active" data-explode="0">0%</button>
              <button class="btn btn-jump" data-explode="35">35%</button>
              <button class="btn btn-jump" data-explode="70">70%</button>
              <button class="btn btn-jump" data-explode="100">100%</button>
            </span>
            <button id="btn-auto-demo" class="btn btn-jump">自动演示</button>
          </div>
        </div>
        <button id="explode-toggle" class="btn dock-btn glass">
          <span id="explode-toggle-label">0% 分解</span>
          <svg id="explode-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5; margin-left:6px;"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
      </div>
      </div>
    </div>

    <div id="drawer-2d" class="drawer">
      <div class="drawer-head">
        <div>
          <h2>2D 矢量切片查看</h2>
          <p class="mono drawer-sub">Layer path inspector</p>
        </div>
        <button id="btn-close-2d" class="btn">关闭</button>
      </div>
      <div id="drawer-layer-tabs" class="drawer-tabs"></div>
      <div class="drawer-body">
        <div class="mode-row">
          <span>显示模式</span>
          <span>
            <button id="btn-mode-solid" class="btn active">工艺白</button>
            <button id="btn-mode-laser" class="btn btn-laser">激光切线</button>
          </span>
        </div>
        <div class="svg-viewport">
          <div id="svg-preview-container"></div>
          <span id="svg-canvas-badge" class="mono canvas-badge">viewBox --</span>
        </div>
        <div class="layer-tech-card">
          <div class="control-head">
            <h3 id="card-layer-name" class="value">图层名称</h3>
            <span id="card-layer-depth" class="mono">景深 --</span>
          </div>
          <p id="card-layer-desc" class="hint"></p>
                  </div>
      </div>
    </div>



    <div id="toast" class="toast hidden"><span id="toast-msg"></span></div>

    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
